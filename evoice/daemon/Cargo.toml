[package]
name = "e-voice-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "e-voice daemon: the one local process every voice client talks to, on :5700"
license = "MIT"
build = "../core/link.rs"

[lib]
name = "e_voice_daemon"

[[bin]]
name = "evoiced"
path = "src/main.rs"

[dependencies]
e-voice-core = { path = "../core", default-features = false }
e-voice-device = { path = "../device" }
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
humantime-serde = "1.1.1"
pulldown-cmark = { version = "0.13.6", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
### axum's own tungstenite, only for its error type: an oversized message on /events closes with 1009, not as
### a hang-up. It must stay the version axum resolves to (Renovate bumps them apart); if they drift the
### downcast misses and the over-cap /events test goes red. The client sockets use tokio-tungstenite above.
tungstenite = "0.29.0"
url = "2.5.8"

[dev-dependencies]
rmcp = { version = "3.11.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1.53.1", features = ["test-util"] }

[lints]
workspace = true
