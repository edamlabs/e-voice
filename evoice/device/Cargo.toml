[package]
name = "e-voice-device"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "e-voice audio devices: microphone capture and speaker playback over cpal"
license = "MIT"

[lib]
name = "e_voice_device"

[lints]
workspace = true

[dependencies]
cpal = "0.18.2"
e-voice-core = { path = "../core", default-features = false }
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
