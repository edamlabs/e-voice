[package]
name = "e-voice-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "e-voice shared core: settings, model store, onnxruntime binding, audio I/O, logging"
license = "MIT"

[lib]
name = "e_voice_core"

[features]
default = ["engine"]
### Inference runtime, model store and file decoding; a client of the services builds without them.
engine = [
  "dep:bzip2",
  "dep:futures-util",
  "dep:hex",
  "dep:ort",
  "dep:reqwest",
  "dep:sha2",
  "dep:sherpa-onnx",
  "dep:symphonia",
  "dep:symphonia-adapter-libopus",
  "dep:tar",
  "dep:tempfile",
  "dep:tokio",
  "dep:walkdir",
]

[dependencies]
audioadapter-buffers = "5.2.0"
bzip2 = { version = "0.6.1", optional = true }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-util = { version = "0.3.34", optional = true }
hex = { version = "0.4.3", optional = true }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-27", "tracing"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"], optional = true }
rubato = "5.1.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.1", optional = true }
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"], optional = true }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "mkv", "opt-simd"], optional = true }
symphonia-adapter-libopus = { version = "0.3.0", optional = true }
tar = { version = "0.4.46", optional = true }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"], optional = true }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
walkdir = { version = "2.5.0", optional = true }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test", "toml", "env"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
wiremock = "0.6.5"

[lints]
workspace = true
